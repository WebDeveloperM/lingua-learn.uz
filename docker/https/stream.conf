# One public port for both kinds of visitors. nginx looks at the first bytes of every connection on 8000:
#   plain http  (http://192.168.2.72:8000)   goes to the Django site, exactly as before
#   a TLS handshake (https://192.168.2.72:8000) goes to the https server of site.conf (which also answers on 8443)
# So a visitor who only changes http:// to https:// in the address bar gets the site, not "ERR_SSL_PROTOCOL_ERROR".

map $ssl_preread_protocol $port_8000_target {
    ""      web:8000;
    default 127.0.0.1:8443;
}

server {
    listen 8000;

    # Docker's own DNS, asked again every few seconds: the web container may be rebuilt and get a new address
    resolver 127.0.0.11 valid=5s ipv6=off;

    ssl_preread on;
    # browsers open spare connections and use them much later: do not cut them off after the default 30 seconds
    preread_timeout 5m;

    proxy_pass $port_8000_target;
    proxy_connect_timeout 10s;
    proxy_timeout 10m;
}
