# https for the Learn English site. nginx answers on 8443 with the certificate made by 05-local-certs.sh and hands every
# request to the Django container (web:8000), telling it that the visitor came over https.

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:tls:2m;
    ssl_session_timeout 1h;

    # recordings of the Speaking practice (up to 3 x 5 MB) and the audio of the courses (up to 30 MB) come through here
    client_max_body_size 100m;

    # somebody typed http:// on the https port: send them to https
    error_page 497 =307 https://$http_host$request_uri;

    # the public half of the local certificate authority: a device that installs it stops showing the certificate warning
    location = /local-ca.crt {
        alias /certs/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="learn-english-local-ca.crt"' always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        # Docker's own DNS, asked again every few seconds: the web container may be rebuilt and get a new address
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $web http://web:8000;
        proxy_pass $web;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        # saving the answers of the Speaking practice waits for the AI, which can take about two minutes when it is busy
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
