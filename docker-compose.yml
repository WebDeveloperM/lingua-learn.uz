services:
  web:
    build: .
    image: english-project
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - app_data:/data
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: requirements.txt

volumes:
  app_data:
