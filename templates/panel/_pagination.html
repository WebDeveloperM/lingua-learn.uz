{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Sahifalar">
    {% if page_obj.has_previous %}
        <a class="btn btn-ghost btn-xs" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Oldingi</a>
    {% endif %}
    <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="btn btn-ghost btn-xs" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Keyingi →</a>
    {% endif %}
</nav>
{% endif %}
