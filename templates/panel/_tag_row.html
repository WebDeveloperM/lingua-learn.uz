<div class="formset-row" data-row {% if f.DELETE.value %}hidden{% endif %}>
    {% for hidden in f.hidden_fields %}{{ hidden }}{% endfor %}
    <div class="row-field">
        {{ f.name }}
        {% if f.name.errors %}<div class="form-errors">{{ f.name.errors }}</div>{% endif %}
    </div>
    <label class="check-inline">{{ f.highlighted }} <span>Ajratib ko'rsatish</span></label>
    <span class="row-delete">{{ f.DELETE }}</span>
    <button type="button" class="icon-btn" data-remove aria-label="Qatorni olib tashlash">×</button>
</div>
